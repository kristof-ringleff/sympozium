{{- if .Values.celln.enabled }}
{{- $bootstrap := .Values.celln.bootstrap | default dict }}
{{- $clientSecret := $bootstrap.clientTokenSecret | default "celln-router-client" }}
{{- $backendSecret := $bootstrap.backendTokenSecret | default "celln-dispatcher-backend" }}
{{- $capabilitySecret := $bootstrap.capabilityTokenSecret | default "celln-discovery" }}
{{- $ownershipClaim := $bootstrap.ownershipClaim | default "celln-router-ownership" }}
{{- $routerImage := "" }}
{{- if not .Values.celln.router.external }}
{{- if .Values.celln.router.image.digest }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.celln.router.image.digest) }}
{{- fail "celln.router.image.digest must be a sha256 digest when set" }}
{{- end }}
{{- $routerImage = printf "%s@%s" .Values.celln.router.image.repository .Values.celln.router.image.digest }}
{{- else if .Values.celln.router.image.tag }}
{{- $routerImage = printf "%s:%s" .Values.celln.router.image.repository .Values.celln.router.image.tag }}
{{- else }}
{{- fail "celln.router.image.digest (recommended) or celln.router.image.tag is required" }}
{{- end }}
{{- end }}
{{- $fleet := .Values.celln.fleet | default dict }}
{{- $clientToken := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace $clientSecret }}{{ $clientToken = index .data "token" | b64dec }}{{ end }}
{{- $backendToken := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" "celln-system" $backendSecret }}{{ $backendToken = index .data "token" | b64dec }}{{ end }}
{{- $capabilityToken := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace $capabilitySecret }}{{ $capabilityToken = index .data "token" | b64dec }}{{ end }}
{{- if and (not (hasPrefix "https://" .Values.celln.routerUrl)) (not .Values.celln.allowInsecureHttp) }}
{{- fail "Celln requires an HTTPS routerUrl or explicit celln.allowInsecureHttp acknowledgement" }}
{{- end }}
{{- if .Values.celln.router.external }}
{{- if or (not .Values.celln.tokenSecret) (not .Values.celln.capabilityTokenSecret) (eq .Values.celln.tokenSecret .Values.celln.capabilityTokenSecret) }}
{{- fail "external Celln router requires distinct execution and discovery token Secrets" }}
{{- end }}
{{- else }}
{{- if and (not .Values.celln.router.backends) (not $fleet.enabled) }}
{{- fail "the Celln router needs the fleet (celln.fleet.enabled): the single in-cluster dispatcher and the host installer were removed in 0.12" }}
{{- end }}
{{- range .Values.celln.router.backends }}
{{- if not (regexMatch "^http://[^/,?#@[:space:]]+(:[0-9]+)?$" .) }}
{{- fail "celln.router.backends requires explicit HTTP origins (HTTPS is not supported by this router)" }}
{{- end }}
{{- end }}
{{- if not .Values.celln.router.allowInsecureBackends }}
{{- fail "celln.router.allowInsecureBackends must explicitly acknowledge the plaintext backend transport" }}
{{- end }}
{{- if or (not .Values.celln.router.clientTokenSecret) (not .Values.celln.router.backendTokenSecret) (not .Values.celln.tokenSecret) }}
{{- fail "Celln requires controller, router client, and router backend token Secret references" }}
{{- end }}
{{- if eq .Values.celln.router.clientTokenSecret .Values.celln.router.backendTokenSecret }}
{{- fail "Celln client and backend credentials must use distinct Secrets" }}
{{- end }}
{{- if not .Values.celln.router.ownershipClaim }}
{{- fail "celln.router.ownershipClaim must reference durable shared POSIX storage" }}
{{- end }}
{{- if or (not .Values.celln.capabilityTokenSecret) (not .Values.celln.router.capabilityTokenSecret) }}
{{- fail "Celln requires API-server and router read-only capability token Secret references" }}
{{- end }}
{{- if or (eq .Values.celln.capabilityTokenSecret .Values.celln.tokenSecret) (eq .Values.celln.router.capabilityTokenSecret .Values.celln.router.clientTokenSecret) (eq .Values.celln.router.capabilityTokenSecret .Values.celln.router.backendTokenSecret) }}
{{- fail "Celln capability credentials must use distinct Secrets from execution credentials" }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
{{- if $bootstrap.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $clientToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientSecret }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $clientToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $backendSecret }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $backendToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $capabilitySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $capabilityToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $capabilitySecret }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $capabilityToken | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $ownershipClaim }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
spec:
  accessModes:
  - {{ $bootstrap.ownershipAccessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ $bootstrap.ownershipStorage | default "1Gi" }}
  {{- with $bootstrap.ownershipStorageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.celln.router.external }}
---
# Every replica sees the same backend identities and durable owner ledger.
{{- $mediated := include "sympozium.cellnMediation" . }}
{{- $mediation := .Values.celln.mediation | default dict }}
{{- $receiverPort := int (($mediation.receiver | default dict).port | default 9443) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  replicas: {{ .Values.celln.router.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: router
        image: {{ $routerImage | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/celln"]
        args:
        - route
        - --listen
        - 0.0.0.0:8788
        {{- if .Values.celln.router.backends }}
        - --backends
        - {{ join "," .Values.celln.router.backends | quote }}
        {{- end }}
        {{- if $fleet.enabled }}
        # Every ready fleet owner, resolved through the headless Service.
        - --backends-srv
        - celln-node.celln-system.svc.cluster.local:8787
        {{- end }}
        - --token-file
        - /etc/celln/backend/token
        - --client-token-file
        - /etc/celln/client/token
        - --capability-token-file
        - /etc/celln/capability/token
        {{- if .Values.celln.router.parentTokenSecret }}
        - --parent-token-file
        - /etc/celln/parent/token
        {{- end }}
        {{- if $mediated }}
        # Mediated runs: forward /v1/scoped/* to the node that prepared each
        # operation. The same operator token the dispatchers verify.
        - --scoped-token-file
        - /etc/celln/scoped/operator-token
        {{- end }}
        - --ownership-dir
        - /var/lib/celln/ownership
        - --mode
        - round-robin
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: http
          containerPort: 8788
          protocol: TCP
        volumeMounts:
        {{- if .Values.celln.router.parentTokenSecret }}
        - name: parent-token
          mountPath: /etc/celln/parent
          readOnly: true
        {{- end }}
        - name: client-token
          mountPath: /etc/celln/client
          readOnly: true
        - name: backend-token
          mountPath: /etc/celln/backend
          readOnly: true
        - name: ownership
          mountPath: /var/lib/celln/ownership
        - name: capability-token
          mountPath: /etc/celln/capability
          readOnly: true
        {{- if $mediated }}
        - name: scoped-operator
          mountPath: /etc/celln/scoped
          readOnly: true
        {{- end }}
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      {{- if $mediated }}
      # The router speaks plaintext HTTP and the controller only talks to an
      # HTTPS receiver with a pinned CA. This unprivileged edge terminates TLS
      # and forwards nothing but POST /v1/scoped/* to the router on loopback;
      # the operator bearer and signed permits remain the authority, checked
      # by the dispatcher on the owning node.
      - name: scoped-receiver
        image: {{ include "sympozium.controllerImage" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/celln-scoped-receiver"]
        args:
          - --listen
          - {{ printf "0.0.0.0:%d" $receiverPort | quote }}
          - --backend
          - http://127.0.0.1:8788
          - --tls-cert
          - /etc/celln/receiver-tls/tls.crt
          - --tls-key
          - /etc/celln/receiver-tls/tls.key
        ports:
          - name: scoped-https
            containerPort: {{ $receiverPort }}
            protocol: TCP
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        volumeMounts:
          - name: scoped-receiver-tls
            mountPath: /etc/celln/receiver-tls
            readOnly: true
      {{- end }}
      volumes:
      {{- if .Values.celln.router.parentTokenSecret }}
      - name: parent-token
        secret:
          secretName: {{ .Values.celln.router.parentTokenSecret | quote }}
          defaultMode: 0440
      {{- end }}
      - name: client-token
        secret:
          secretName: {{ .Values.celln.router.clientTokenSecret | quote }}
          defaultMode: 0440
      - name: backend-token
        secret:
          secretName: {{ .Values.celln.router.backendTokenSecret | quote }}
          defaultMode: 0440
      - name: ownership
        persistentVolumeClaim:
          claimName: {{ .Values.celln.router.ownershipClaim | quote }}
      - name: capability-token
        secret:
          secretName: {{ .Values.celln.router.capabilityTokenSecret | quote }}
          defaultMode: 0440
      {{- if $mediated }}
      - name: scoped-operator
        secret:
          secretName: {{ $mediation.nodeSecret | quote }}
          defaultMode: 0440
          items:
            - key: operator-token
              path: operator-token
      # Readable by the non-root edge (UID 65532), which alone mounts it; a
      # Secret volume cannot be owned by that user.
      - name: scoped-receiver-tls
        secret:
          secretName: {{ $mediation.nodeSecret | quote }}
          defaultMode: 0444
          items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    app.kubernetes.io/name: celln-router
  ports:
  - name: http
    port: 8787
    targetPort: 8788
    protocol: TCP
{{- end }}
{{- end }}
{{- end }}
